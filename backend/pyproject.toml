[project]
name = "freelance-agent"
version = "0.2.0"
description = "Personal multi-platform part-time discovery"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "pydantic==2.13.5", "uvicorn==0.54.0", "huey==3.4.0"]

[project.scripts]
freelance-api = "freelance.bootstrap.api:main"
freelance-jobs = "freelance.bootstrap.cli:main"
freelance-daily = "freelance.bootstrap.daily:main"
freelance-worker = "freelance.bootstrap.worker:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
gmail = ["google-auth[requests]>=2.38,<3", "google-auth-oauthlib>=1.2,<2"]

[dependency-groups]
dev = ["httpx2==2.13.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freelance"]
