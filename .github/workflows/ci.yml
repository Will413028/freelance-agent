name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    # Weekly full-history secret scan (about a minute); the other jobs skip it.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:18.7-bookworm
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: side_income_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # typecheck, boundaries (incl. retired imports, plan D27), db:check (Postgres schema and migrations agree),
      # test (PGlite), compose and migration checks, deploy, browser and pre-push hook tests.
      - run: pnpm check
      # Every test again on a real Postgres 18: each one using tests/helpers/pg.ts freshPg switches to it,
      # the rest are unaffected. Running the whole suite means no Postgres test can be left out by its file name.
      # Test files run one at a time (vitest.config.ts fileParallelism), so freshPg's schema reset never races.
      - run: pnpm exec vitest run
        env:
          TEST_PG_URL: postgres://postgres:test@localhost:5432/side_income_test
      - run: pnpm build

  secrets:
    # The repository is public: gitleaks (pinned binary, checksum checked) on the commits this event adds,
    # with .gitleaks.toml. A pull request scans base..head, a push before..after, a new branch or the weekly
    # schedule the whole history. The local .githooks/pre-push is the earlier, opt-in warning; this is the net.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          range=""
          if [[ $EVENT == pull_request ]]; then
            range="$PR_BASE..$PR_HEAD"
          elif [[ $EVENT == push && -n $BEFORE && $BEFORE != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          fi
          echo "gitleaks range: ${range:-full history}"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 ${range:+--log-opts="$range"} .

  image:
    if: github.event_name != 'schedule'
    # The application image builds and starts on arm64, the VM's architecture (not pushed; the VM
    # builds its own from a checkout).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/web.Dockerfile -t side-income-web:ci web
      # Image size in the log, to compare across changes (plan step 11 records before and after).
      - run: docker image inspect side-income-web:ci --format 'image size {{.Size}} bytes'
      # pnpm runs as the runtime user without fetching anything (corepack cache readable, no network).
      - run: docker run --rm --network none side-income-web:ci pnpm exec tsx --version
      # The browser tier (plan step 8d; its contract tests run in pnpm check): the image builds on arm64 and
      # renders a local page with the compose service's restrictions (no capabilities, non-root, no new privileges).
      - run: docker build -f deploy/browser.Dockerfile -t side-income-web:ci-browser browser
      - run: docker image inspect side-income-web:ci-browser --format 'browser image size {{.Size}} bytes'
      - name: Browser tier renders a page
        run: |
          docker network create smoke
          docker run -d --name page --network smoke nginx:1.29.3-alpine
          docker run -d --name browser --network smoke -p 127.0.0.1:3100:3100 --cap-drop ALL --security-opt no-new-privileges:true --shm-size 512m --init side-income-web:ci-browser
          for i in $(seq 30); do curl -fsS http://127.0.0.1:3100/healthz && break; sleep 1; done
          out=$(curl -sS -D headers.txt -X POST http://127.0.0.1:3100/render -d '{"url":"http://page/","timeoutMs":30000,"waitFor":"h1"}')
          cat headers.txt
          grep -qi '^x-upstream-status: 200' headers.txt
          grep -q 'Welcome to nginx' <<<"$out"
          missing=$(curl -sS -D - -o /dev/null -X POST http://127.0.0.1:3100/render -d '{"url":"http://page/missing","timeoutMs":30000}')
          grep -qi '^x-upstream-status: 404' <<<"$missing"
          # A selector that never appears is 422 (layout changed) within the budget, and the next render still works.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 40 -X POST http://127.0.0.1:3100/render -d '{"url":"http://page/","timeoutMs":15000,"waitFor":".never"}')
          echo "missing selector: $code"; test "$code" = 422
          curl -fsS -o /dev/null -D - -X POST http://127.0.0.1:3100/render -d '{"url":"http://page/","timeoutMs":30000}' | grep -qi '^x-upstream-status: 200'
      - if: failure()
        run: docker logs browser || true

  gate:
    # The only required check on main: it passes when every other job in this workflow succeeded or was skipped.
    name: gate (ci)
    if: always()
    needs: [web, image, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a needed job ended with: $r"; exit 1 ;; esac
          done
