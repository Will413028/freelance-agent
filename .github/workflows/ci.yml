name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:18.7-bookworm
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: side_income_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # typecheck, boundaries, db:check (both dialects: schema and migrations agree), test (PGlite), compose port check.
      - run: pnpm check
      # The Postgres tests again, on a real Postgres 18.
      - run: pnpm exec vitest run tests/pg-
        env:
          TEST_PG_URL: postgres://postgres:test@localhost:5432/side_income_test
      - run: pnpm build

  image:
    # The application image builds (not pushed; the VM builds its own from a checkout).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/web.Dockerfile -t side-income-web:ci web

  gate:
    # The only required check on main: it passes when every other job in this workflow succeeded or was skipped.
    name: gate (ci)
    if: always()
    needs: [web, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a needed job ended with: $r"; exit 1 ;; esac
          done
