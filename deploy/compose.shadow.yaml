# Shadow job service (plan step 4e3), run by the host timers in deploy/systemd/.
#   docker compose -f deploy/compose.shadow.yaml run --rm shadow after
# One-time load of the D1 shadow (step 4e4; ask Will before every reload):
#   docker compose -f deploy/compose.shadow.yaml run --rm --entrypoint pnpm shadow exec tsx scripts/import-copy.ts --sqlite /shadow/copies/<copy> --confirm-drop <database id> --report /shadow/reports/import-<day>.json
# SHADOW_ENV is a 0600 file holding CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID and D1_API_TOKEN (the D1 shadow).
name: freelance-agent-shadow
services:
  shadow:
    image: ${SHADOW_IMAGE:-freelance-agent-shadow:local}
    build:
      context: ..
      dockerfile: deploy/shadow.Dockerfile
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /home/node
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: ${SHADOW_ENV:?set SHADOW_ENV}
    volumes:
      - ${DATA_DIR:?set DATA_DIR}:/data:ro
      - ${SHADOW_DIR:?set SHADOW_DIR}:/shadow
