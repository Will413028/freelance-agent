# The self-hosted system (plan step 2). Run from the repository root on the VM:
#   docker compose --env-file /etc/side-income/compose.env -f deploy/compose.yaml up -d
# The env file (0600) sets APP_IMAGE and POSTGRES_PASSWORD, and RESEND_API_KEY and RESEND_INBOX for the daily run. Every published port binds 127.0.0.1;
# deploy/check-compose.mjs fails otherwise. Tailscale Serve is the only way in.
name: side-income

x-app: &app
  image: ${APP_IMAGE:?set APP_IMAGE in the env file}
  environment: &app-env
    DATABASE_URL: postgres://side_income:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}@db:5432/side_income
  depends_on:
    db:
      condition: service_healthy
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_USER: side_income
      POSTGRES_DB: side_income
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U side_income -d side_income"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    <<: *app
    ports:
      - "127.0.0.1:3347:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # The daily run (plan step 6; deploy/systemd/side-income-daily.timer starts it): docker compose run --rm daily
  # One-off commands override the command: docker compose run --rm daily pnpm exec tsx scripts/<name>.ts
  # Only this service gets the Resend key (full_access; the code sends GETs to Receiving only, plan step 7).
  # Unset values reach the run as empty: the mail sources then fail with MailConfigError, the rest still run.
  daily:
    <<: *app
    environment:
      <<: *app-env
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_INBOX: ${RESEND_INBOX:-}
      BROWSER_URL: http://browser:3100
    profiles: [jobs]
    networks: [default, browser]
    command: ["pnpm", "exec", "tsx", "scripts/daily.ts"]

  # Migrations (deploy.sh runs it with the new image before switching): the database URL only, no Resend
  # key and no browser network (design review 12e O3; deploy/check-compose.mjs keeps the key on daily alone).
  migrate:
    <<: *app
    profiles: [jobs]
    command: ["pnpm", "exec", "tsx", "scripts/migrate-pg.ts"]

  # The browser tier (plan step 8d): renders a page for the sources whose maxTier is "browser". No
  # published port. It sits on its own network shared only with daily, never with db or web: it loads
  # untrusted pages (code review, step 8d). Built by deploy.sh with the app image's tag plus "-browser",
  # so a rollback of APP_IMAGE moves it too. Not a dependency of daily (a missing image would stop the
  # whole run): the systemd unit starts it before the run and removes it after; without it only the
  # browser-tier sources fail.
  browser:
    image: ${APP_IMAGE:?set APP_IMAGE in the env file}-browser
    profiles: [jobs]
    networks: [browser]
    init: true
    shm_size: 512m # Chromium uses /dev/shm; the 64 MB default crashes tabs (Playwright docs)
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 6

networks:
  default:
  browser:

volumes:
  pgdata:
